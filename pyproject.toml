[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge-pro"
version = "1.1.0"
description = "Opinionated, safety-focused Python project bootstrapper"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-RepoForge-Proprietary"
license-files = ["LICENSE.txt"]
authors = [{ name = "Wizard Productions AI Studio" }]

[project.scripts]
repoforge = "repoforge:main"
repoforge-build-release = "build_release:main"

[tool.setuptools]
py-modules = ["repoforge", "build_release"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "DTZ",
  "E",
  "F",
  "I",
  "PLC",
  "PLW",
  "RUF",
  "SIM",
  "UP",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["repoforge.py", "repoforge_lite.py", "build_release.py"]
